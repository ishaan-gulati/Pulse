<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pulse — Early Access</title>

<script src="https://getlaunchlist.com/js/widget.js" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#07070e;
color:#c4c4d4;
font-family:'DM Sans',sans-serif;
overflow-x:hidden;
}

/* background glow */

.bg-glow{
position:fixed;
width:900px;
height:900px;
background:radial-gradient(circle,rgba(124,58,237,0.15) 0%, transparent 70%);
top:-300px;
right:-200px;
filter:blur(120px);
z-index:-1;
}

/* container */

.wrapper{
max-width:1100px;
margin:auto;
padding:80px 24px;
}

/* nav */

nav{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:80px;
}

.logo{
font-family:'Plus Jakarta Sans',sans-serif;
font-weight:800;
font-size:22px;
color:white;
}

.back{
text-decoration:none;
color:#9f67f8;
font-weight:500;
}

/* layout */

.waitlist-layout{
display:grid;
grid-template-columns:1fr 420px;
gap:100px;
align-items:center;
}

/* left text */

.hero-title{
font-family:'Plus Jakarta Sans',sans-serif;
font-size:48px;
font-weight:800;
line-height:1.2;
color:white;
margin-bottom:20px;
}

.hero-sub{
color:#9b9bb3;
font-size:18px;
max-width:520px;
}

/* waitlist card */

.waitlist-card{
background:linear-gradient(135deg,rgba(124,58,237,0.08),rgba(124,58,237,0.02));
border:1px solid rgba(124,58,237,0.25);
border-radius:20px;
padding:40px;
backdrop-filter:blur(20px);
box-shadow:0 30px 80px rgba(0,0,0,0.6);
position:relative;
}

.waitlist-card::before{
content:'';
position:absolute;
inset:-1px;
border-radius:20px;
background:linear-gradient(135deg,transparent,#9f67f8,transparent);
opacity:0.25;
filter:blur(18px);
z-index:-1;
}

.card-title{
font-family:'Plus Jakarta Sans',sans-serif;
font-size:26px;
font-weight:700;
color:white;
margin-bottom:6px;
}

.card-sub{
color:#8e8ea8;
font-size:14px;
margin-bottom:28px;
}

/* launchlist form override */

.launchlist-widget input{
width:100%;
padding:14px 16px;
border-radius:10px;
border:1px solid #1a1a32;
background:#0f0f1e;
color:white;
margin-bottom:14px;
}

.launchlist-widget button{
width:100%;
padding:14px;
border-radius:12px;
border:none;
font-weight:700;
background:linear-gradient(135deg,#7c3aed,#5b21b6);
color:white;
cursor:pointer;
}

.proof{
text-align:center;
margin-top:14px;
font-size:13px;
color:#8e8ea8;
}

/* mobile */

@media(max-width:900px){

.waitlist-layout{
grid-template-columns:1fr;
gap:60px;
}

.hero-title{
font-size:38px;
}

}

</style>

</head>

<body>

<div class="bg-glow"></div>

<div class="wrapper">

<nav>
<div class="logo">Pulse</div>
<a class="back" href="/">← Back</a>
</nav>

<div class="waitlist-layout">

<div>
<h1 class="hero-title">
Get Early Access to Pulse
</h1>

<p class="hero-sub">
Join the waitlist and be one of the first people to try Pulse when we launch.
</p>
</div>

<div class="waitlist-card">

<div class="card-title">Join the Waitlist</div>
<div class="card-sub">
Be the first to know when Pulse goes live.
</div>

<div class="launchlist-widget" data-key="YOUR_LAUNCHLIST_KEY"></div>

<div class="proof">
🚀 Early users joining daily
</div>

</div>

</div>

</div>

</body>
</html>
